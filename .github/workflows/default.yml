name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/fh5dl
      - name: install.sh installs the latest release
        run: FH5DL_DIR="$RUNNER_TEMP/bin" sh install.sh && "$RUNNER_TEMP/bin/fh5dl" --version
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: install.ps1 installs the latest release
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\fh5dl\fh5dl.exe" --version
